<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Rajesh Anand | BIC Team - Gurgaon</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1a56db 100%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* Main card */
        .welcome-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 3rem 3.5rem;
            max-width: 900px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            animation: cardIn 0.8s ease forwards;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Badge */
        .welcome-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #1f2937;
            padding: 0.4rem 1.4rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 1.75rem;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        /* Photo */
        .guest-photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            object-position: top center;
            border: 4px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
            animation: photoIn 1s ease 0.3s both;
        }

        @keyframes photoIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Name & Title */
        .guest-name {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .guest-title {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 400;
            margin-bottom: 1.75rem;
        }

        /* Divider */
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #f59e0b, #1a56db);
            border-radius: 3px;
            margin: 0 auto 1.75rem;
        }

        /* Message */
        .welcome-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
            max-width: 650px;
            margin: 0 auto 2rem;
        }

        /* Location pill */
        .location-info {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 0.65rem 1.4rem;
            border-radius: 30px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 2rem;
        }

        /* Team signature */
        .team-signature {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.75rem;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .team-logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: #f59e0b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-card {
                padding: 2rem 1.5rem;
            }

            .guest-name {
                font-size: 2rem;
            }

            .guest-photo {
                width: 130px;
                height: 130px;
            }
        }

        @media (max-width: 480px) {
            .guest-name {
                font-size: 1.6rem;
            }

            .guest-title {
                font-size: 1.05rem;
            }

            .welcome-message {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="welcome-card">
        <div class="welcome-badge">Welcome to Gurgaon</div>
        <br>
        <img src="rajesh-anand.jpg" alt="Rajesh Anand" class="guest-photo">
        <h1 class="guest-name">Rajesh Anand</h1>
        <p class="guest-title">Senior Manager</p>
        <div class="divider"></div>
        <p class="welcome-message">
            We are delighted to welcome you to the Gurgaon location for an in-person
            connect with the BIC team. Your visit means a great deal to us and we look
            forward to an engaging and inspiring time together.
        </p>
        <div class="location-info">
            <span>&#128205;</span>
            <span>Gurgaon Location</span>
        </div>
        <br><br>
        <div class="team-signature">
            <span class="team-logo">BIC</span>
            <span>Team Gurgaon</span>
        </div>
    </div>

    <script>
        (function () {
            var container = document.getElementById('particles');
            for (var i = 0; i < 25; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                var size = (2 + Math.random() * 4) + 'px';
                p.style.width = size;
                p.style.height = size;
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
